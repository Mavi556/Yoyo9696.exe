
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 98 de Bolso</title>
    <style>
        /* Cores e Reset Clássicos do Win98 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tahoma', 'Geneva', sans-serif;
            font-size: 12px;
            image-rendering: pixelated;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #008080;
            user-select: none;
        }
        /* Área de Trabalho */
        .desktop {
            width: 100%;
            height: calc(100% - 40px);
            position: relative;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: flex-start;
        }
        .icon {
            width: 80px;
            text-align: center;
            color: white;
            cursor: pointer;
            text-shadow: 1px 1px black;
        }
        .icon img {
            width: 32px;
            height: 32px;
            display: block;
            margin: 0 auto 5px;
        }
        /* Estilo das Janelas (Efeito 3D Clássico) */
        .window {
            position: absolute;
            background: #bfbfbf;
            border: 2px solid;
            border-color: #fff #555 #555 #fff;
            box-shadow: 1px 1px 0 0 #000;
            padding: 2px;
            display: none;
            flex-direction: column;
            min-width: 250px;
            z-index: 10;
        }
        .window-header {
            background: linear-gradient(90deg, #000080, #1084d0);
            color: white;
            padding: 3px 6px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: move;
        }
        .window-title {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .close-btn {
            background: #bfbfbf;
            border: 1px solid;
            border-color: #fff #555 #555 #fff;
            width: 16px;
            height: 14px;
            font-size: 9px;
            font-weight: bold;
            color: black;
            text-align: center;
            line-height: 12px;
            cursor: pointer;
        }
        .close-btn:active {
            border-color: #555 #fff #fff #555;
            padding: 1px 0 0 1px;
        }
        .window-body {
            background: white;
            border: 2px solid;
            border-color: #555 #fff #fff #555;
            flex-grow: 1;
            padding: 5px;
            color: black;
        }
        /* Apps Específicos */
        .notepad-txt {
            width: 100%;
            height: 150px;
            border: none;
            resize: none;
            outline: none;
        }
        .calc-screen {
            width: 100%;
            text-align: right;
            margin-bottom: 5px;
            padding: 4px;
            border: 2px solid;
            border-color: #555 #fff #fff #555;
            background: white;
            font-size: 14px;
        }
        .calc-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }
        .calc-buttons button {
            padding: 8px;
            background: #bfbfbf;
            border: 1px solid;
            border-color: #fff #555 #555 #fff;
            cursor: pointer;
        }
        .calc-buttons button:active {
            border-color: #555 #fff #fff #555;
        }
        .ie-frame {
            width: 100%;
            height: 400px;
            border: none;
        }
        /* Barra de Tarefas */
        .taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: #bfbfbf;
            border-top: 2px solid #fff;
            display: flex;
            align-items: center;
            padding: 2px 5px;
            gap: 5px;
            z-index: 100;
        }
        .start-btn {
            background: #bfbfbf;
            border: 2px solid;
            border-color: #fff #555 #555 #fff;
            font-weight: bold;
            padding: 2px 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            height: 100%;
        }
        .start-btn:active {
            border-color: #555 #fff #fff #555;
        }
        /* Menu Iniciar */
        .start-menu {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 180px;
            background: #bfbfbf;
            border: 2px solid;
            border-color: #fff #555 #555 #fff;
            display: none;
            flex-direction: column;
            z-index: 99;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.3);
        }
        .start-menu-item {
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .start-menu-item:hover {
            background: #000080;
            color: white;
        }
    </style>
</head>
<body>

    <!-- Área de Trabalho com Ícones -->
    <div class="desktop" id="desktop">
        <div class="icon" onclick="openWindow('notepad')">
            <img src="https://alexmeub.com" alt="Notepad">
            Bloco de Notas
        </div>
        <div class="icon" onclick="openWindow('calc')">
            <img src="https://alexmeub.com" alt="Calc">
            Calculadora
        </div>
        <div class="icon" onclick="openWindow('ie')">
            <img src="https://alexmeub.com" alt="IE">
            Internet Explorer
        </div>
    </div>

    <!-- JANELA: BLOCO DE NOTAS -->
    <div class="window" id="win-notepad" style="top: 50px; left: 50px; width: 300px;">
        <div class="window-header" onmousedown="dragStart(event, 'win-notepad')">
            <div class="window-title">
                <img src="https://alexmeub.com" width="16" alt="">
                Sem título - Bloco de Notas
            </div>
            <div class="close-btn" onclick="closeWindow('notepad')">X</div>
        </div>
        <div class="window-body">
            <textarea class="notepad-txt" placeholder="Digite seu texto aqui..."></textarea>
        </div>
    </div>

    <!-- JANELA: CALCULADORA -->
    <div class="window" id="win-calc" style="top: 80px; left: 120px; width: 220px;">
        <div class="window-header" onmousedown="dragStart(event, 'win-calc')">
            <div class="window-title">
                <img src="https://alexmeub.com" width="16" alt="">
                Calculadora
            </div>
            <div class="close-btn" onclick="closeWindow('calc')">X</div>
        </div>
        <div class="window-body">
            <input type="text" class="calc-screen" id="calc-display" value="0" readonly>
            <div class="calc-buttons">
                <button onclick="pressCalc('7')">7</button><button onclick="pressCalc('8')">8</button><button onclick="pressCalc('9')">9</button><button onclick="pressCalc('/')">/</button>
                <button onclick="pressCalc('4')">4</button><button onclick="pressCalc('5')">5</button><button onclick="pressCalc('6')">6</button><button onclick="pressCalc('*')">*</button>
                <button onclick="pressCalc('1')">1</button><button onclick="pressCalc('2')">2</button><button onclick="pressCalc('3')">3</button><button onclick="pressCalc('-')">-</button>
                <button onclick="pressCalc('C')">C</button><button onclick="pressCalc('0')">0</button><button onclick="pressCalc('=')">=</button><button onclick="pressCalc('+')">+</button>
            </div>
        </div>
    </div>

    <!-- JANELA: INTERNET EXPLORER -->
    <div class="window" id="win-ie" style="top: 120px; left: 200px; width: 600px; max-width: 90%;">
        <div class="window-header" onmousedown="dragStart(event, 'win-ie')">
            <div class="window-title">
                <img src="https://alexmeub.com" width="16" alt="">
                Internet Explorer
            </div>
            <div class="close-btn" onclick="closeWindow('ie')">X</div>
        </div>
        <div class="window-body" style="padding: 0;">
            <iframe class="ie-frame" src="https://oldweb.today"></iframe>
        </div>
    </div>

    <!-- Menu Iniciar Oculto -->
    <div class="start-menu" id="start-menu">
        <div class="start-menu-item" onclick="openWindow('notepad'); toggleStart();">
            <img src="https://alexmeub.com" width="16" alt=""> Bloco de Notas
        </div>
        <div class="start-menu-item" onclick="openWindow('calc'); toggleStart();">
            <img src="https://alexmeub.com" width="16" alt=""> Calculadora
        </div>
        <div class="start-menu-item" onclick="openWindow('ie'); toggleStart();">
            <img src="https://alexmeub.com" width="16" alt=""> Internet Explorer
        </div>
    </div>

    <!-- Barra de Tarefas inferior -->
    <div class="taskbar">
        <button class="start-btn" onclick="toggleStart()">
            <img src="https://alexmeub.com" width="16" alt=""> Iniciar
        </button>
    </div>
<!-- JANELA: BLOCO DE NOTAS -->
    <div class="window" id="win-notepad" style="top: 50px; left: 50px; width: 300px;">
        <div class="window-header" onmousedown="dragStart(event, 'win-yoyo9696.exe')">
            <div class="window-title">
                <img src="https://i.ibb.co/5XBHDjPY/IMG-6157.gif" width="16" alt="">
              <a href="https://imgbb.com/"><img src="https://i.ibb.co/5XBHDjPY/IMG-6157.gif" alt="IMG 6157" border="0"></a><br /><a target='_blank' href='https://pt.imgbb.com/'>eliminar imagem do servidor</a></br>
              
                Sem título - Bloco de Notas
            </div>
            <div class="close-btn" onclick="closeWindow('yoyo9696.exe')">X</div>
        </div>
<script>
  
    // Funções para Abrir e Fechar Janelas
  function openWindow(id) {
        const win = document.getElementById('win-' + id);
      win.style.display = 'flex';// Traz a janela clicada para a frente
    document.querySelectorAll('.window').forEach(w => w.style.zIndex = 10);win.style.zIndex = 11;}function closeWindow(id) {document.getElementById('win-' + id).style.display = 'none';}// Alternar Menu Iniciar
  function toggleStart() {const menu = document.getElementById('start-menu');menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';}// Lógica do Sistema de Arrastar Janelas (Drag and Drop)
  let activeWin = null;let offsetX = 0, offsetY = 0;function dragStart(e, id) {activeWin = document.getElementById(id);document.querySelectorAll('.window').forEach(w => w.style.zIndex = 10);activeWin.style.zIndex = 11;offsetX = e.clientX - activeWin.getBoundingClientRect().left;offsetY = e.clientY - activeWin.getBoundingClientRect().top;document.addEventListener('mousemove', dragMove);document.addEventListener('mouseup', dragEnd);}function dragMove(e) {if (!activeWin) return;activeWin.style.left = (e.clientX - offsetX) + 'px';activeWin.style.top = (e.clientY - offsetY) + 'px';}function dragEnd() {activeWin = null;document.removeEventListener('mousemove', dragMove);document.removeEventListener('mouseup', dragEnd);}// Lógica Corrigida da Calculadora
  let calcExpr = "";function pressCalc(val) {const screen = document.getElementById('calc-display');if (val === 'C') {calcExpr = "";screen.value = "0";} else if (val === '=') {try {// Executa o cálculo de forma segura e garante um fallback caso retorne falso/vaziolet 
    res = new Function('return ' + calcExpr)();screen.value = res !== undefined ? res : "0";calcExpr = screen.value;} catch {screen.value = "Erro";calcExpr = "";}} else {if (calcExpr === "0" || screen.value === "Erro") {calcExpr = "";}calcExpr += val;screen.value = calcExpr;}}win.style.display = 'flex';// Traz a janela clicada para a frente
  document.querySelectorAll('.window').forEach(w => w.style.zIndex = 10);win.style.zIndex = 11;}function closeWindow(id) {document.getElementById('win-' + id).style.display = 'none';}// Alternar Menu Iniciar
  function toggleStart() {const menu = document.getElementById('start-menu');menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';}// Lógica do Sistema de Arrastar Janelas (Drag and Drop)
  let activeWin = null;let offsetX = 0, offsetY = 0;function dragStart(e, id) {activeWin = document.getElementById(id);document.querySelectorAll('.window').forEach(w => w.style.zIndex = 10);activeWin.style.zIndex = 11;offsetX = e.clientX - activeWin.getBoundingClientRect().left;offsetY = e.clientY - activeWin.getBoundingClientRect().top;document.addEventListener('mousemove', dragMove);document.addEventListener('mouseup', dragEnd);}function dragMove(e) {if (!activeWin) return;activeWin.style.left = (e.clientX - offsetX) + 'px';activeWin.style.top = (e.clientY - offsetY) + 'px';}function dragEnd() {activeWin = null;document.removeEventListener('mousemove', dragMove);document.removeEventListener('mouseup', dragEnd);}// Lógica Corrigida da Calculadora
  let CalcExpr = "";function pressCalc(val) {const screen = document.getElementById('calc-display');if (val === 'C') {calcExpr = "";screen.value = "0";} else if (val === '=') {try {// Executa o cálculo de forma segura e garante um fallback caso retorne falso/vazio
    let res = new Function('return ' + calcExpr)();screen.value = res !== undefined ? res : "0";calcExpr = screen.value;} catch {screen.value = "Erro";calcExpr = "";}} else {if (calcExpr === "0" || screen.value === "Erro") {calcExpr = "";}calcExpr += val;screen.value = calcExpr;}}
</script>
